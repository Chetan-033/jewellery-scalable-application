spring:
  application:
    name: jewellery-erp
  profiles:
    default: online
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:18080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

jewellery:
  edition: online
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  bootstrap:
    enabled: false
  tenant:
    routing-enabled: true
    db-name-prefix: jewellery_erp_tenant_
    system-db-name: jewellery_erp_tenant__system
  storage:
    root: tenants
    default-root: data/uploads
  platform:
    admin-username: ${PLATFORM_ADMIN_USER:platform}
    admin-password: ${PLATFORM_ADMIN_PASSWORD:Platform@123}
    admin-display-name: Platform Admin
  modules:
    enabled:
      - platform
      - identity
      - organization
      - masterdata
      - rates
      - inventory
      - sales
      - purchase
      - payments
      - credit
      - loans
      - manufacturing
      - accounting
      - compliance
      - reporting
      - notifications
      - operations

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.jewellery.erp: INFO
