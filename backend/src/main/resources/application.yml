spring:
  application:
    name: jewellery-erp
  profiles:
    default: offline
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  # Default away from 8080 to avoid clashing with legacy local PHP stacks.
  port: ${SERVER_PORT:18080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

jewellery:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  modules:
    enabled:
      - platform
      - identity
      - organization
      - masterdata
      - rates
      - inventory
      - sales
      - purchase
      - payments
      - credit
      - loans
      - manufacturing
      - accounting
      - compliance
      - reporting
      - notifications
      - operations

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.jewellery.erp: INFO
