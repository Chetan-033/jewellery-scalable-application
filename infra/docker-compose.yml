services:
  mysql:
    image: mysql:8.4
    container_name: jewellery-erp-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_local_only
      MYSQL_DATABASE: jewellery_erp_platform
      MYSQL_USER: erp_app
      MYSQL_PASSWORD: change_me_local_only
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_local_only"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional: use when Docker is available. Host MySQL 8.4 is also supported.
